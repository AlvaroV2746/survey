<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluco Travel</title>
  <link rel="icon" type="image/png" href="assets/logoFavicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="lang-switch" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="page">
    <section class="card" id="card">
      <img class="logo" src="assets/logoFull.png" alt="Bluco Travel">
      <h1 data-i18n="title"></h1>
      <div class="steps" id="steps"></div>
    </section>

    <section class="thanks" id="thanks" aria-live="polite" hidden>
      <div class="check-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 13 10 18 19 7"></polyline>
        </svg>
      </div>
      <p data-i18n="thanks"></p>
      <button type="button" class="btn-outline" id="reiniciar" data-i18n="btn_restart"></button>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
